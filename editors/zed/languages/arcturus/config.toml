name = "Arcturus"
grammar = "arcturus"
path_suffixes = ["storyarc", "granule", "prelude"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
